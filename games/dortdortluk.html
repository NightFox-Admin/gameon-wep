<!DOCTYPE html>
<html lang="tr" data-theme="dark"><head>
<script>const GO={on:null,set(v){v=!!v;if(this.on===v)return;this.on=v;try{parent.postMessage({gameon:v?'start':'end'},'*')}catch(e){}}};</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dört Dörtlük</title>
<style>
:root{--bg1:#fbf3e3;--bg2:#e6d9bf;--fg:#1c1b22;--mut:#6b6877;--card:rgba(255,255,255,.8);--line:rgba(0,0,0,.1);--hole:#d9d2c0;--b1:#2f73ee;--b2:#1747a8;--b3:#0e2d73;--r:#e02229;--y:#fbc412;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a2838;--bg2:#0f0e15;--fg:#f2f0f7;--mut:#a29eb4;--card:rgba(40,38,54,.85);--line:rgba(255,255,255,.1);--hole:#08080c}}
:root[data-theme="dark"]{--bg1:#2a2838;--bg2:#0f0e15;--fg:#f2f0f7;--mut:#a29eb4;--card:rgba(40,38,54,.85);--line:rgba(255,255,255,.1);--hole:#08080c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{background:var(--bg2)}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0,var(--bg1),var(--bg2) 75%) fixed;display:flex;flex-direction:column;align-items:center;padding:12px 14px 24px;overflow-x:hidden}
#app{--s:max(34px,min(calc((100vw - 28px)/7),76px,calc((100dvh - 380px)/7.4)));width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{margin:0;font-size:clamp(24px,6vw,34px);letter-spacing:.5px;font-weight:900}
.logo .mini{width:22px;height:22px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;gap:2px;}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.seg button{padding:8px 12px;border-radius:11px;font-size:14px;font-weight:700;color:var(--mut);transition:.15s}
.seg button.on{background:var(--fg);color:var(--bg2)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:800;font-size:14px;}
.btn:active{transform:scale(.95)}
.btn.go{background:linear-gradient(180deg,var(--b1),var(--b2));color:#fff;border:0;box-shadow:0 4px 0 var(--b3)}
.players{display:flex;gap:8px;align-items:stretch;justify-content:center;width:100%;max-width:520px}
.pl{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid transparent;border-radius:18px;padding:8px 12px;transition:.25s;;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.pl.act{transform:translateY(-3px)}
.pl.r.act{border-color:var(--r);box-shadow:0 0 18px rgba(224,34,41,.45)}
.pl.y.act{border-color:var(--y);box-shadow:0 0 18px rgba(251,196,18,.55)}
.pl.act .mini{animation:bob .7s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.pl .mini{width:38px;height:38px;flex:none}
.pl small{display:block;font-size:12px;color:var(--mut);font-weight:700}
.pl b{font-size:22px;line-height:1}
.pl .t{min-width:0}.pl .t span{font-size:13px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--mut);font-weight:700;min-width:54px}
.dr b{font-size:18px;color:var(--fg)}
#st{font-weight:800;font-size:17px;min-height:26px;text-align:center}
#field{position:relative;width:calc(var(--s)*7);height:calc(var(--s)*6);margin:var(--s) 0 calc(var(--s)*.35)}
#field.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#back{position:absolute;inset:0;border-radius:16px;background:var(--hole);box-shadow:inset 0 0 24px rgba(0,0,0,.4)}
#pieces{position:absolute;inset:0;z-index:1}
#bw{position:absolute;inset:0;z-index:2;pointer-events:none;filter:drop-shadow(0 12px 14px rgba(0,0,0,.4))}
#board{position:absolute;inset:0;border-radius:16px;background:linear-gradient(135deg,var(--b1),var(--b2) 55%,var(--b3));-webkit-mask:radial-gradient(circle calc(var(--s)*.44) at 50% 50%,transparent 98%,#000 100%) 0 0/var(--s) var(--s);mask:radial-gradient(circle calc(var(--s)*.44) at 50% 50%,transparent 98%,#000 100%) 0 0/var(--s) var(--s)}
#board::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.32),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(0,0,0,.22)),repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 4px)}
#rims{position:absolute;inset:0;z-index:3;display:grid;grid-template-columns:repeat(7,1fr);pointer-events:none}
#rims i{width:var(--s);height:var(--s);background:radial-gradient(circle closest-side,transparent 0 80%,rgba(0,0,0,.45) 87%,rgba(0,0,0,0) 88.5%,rgba(255,255,255,.35) 89%,rgba(255,255,255,0) 95%)}
#hl{position:absolute;inset:0;z-index:4;pointer-events:none}
#hl i{position:absolute;width:var(--s);height:var(--s)}
#hl i::before{content:"";position:absolute;inset:5%;border-radius:50%;border:4px solid #fff;box-shadow:0 0 14px 3px #fff,inset 0 0 14px 2px #fff9;animation:pulse .55s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.96);opacity:.75}to{transform:scale(1.04);opacity:1}}
#cols{position:absolute;inset:calc(var(--s)*-1) 0 0 0;z-index:5;display:grid;grid-template-columns:repeat(7,1fr)}
#cols div{cursor:pointer}
.foot{position:absolute;z-index:1;bottom:calc(var(--s)*-.3);width:calc(var(--s)*.7);height:calc(var(--s)*.5);background:linear-gradient(90deg,var(--b3),var(--b2),var(--b3));border-radius:4px 4px 12px 12px;box-shadow:0 6px 8px rgba(0,0,0,.35)}
.foot.l{left:calc(var(--s)*.45)}.foot.rr{right:calc(var(--s)*.45)}
.p,.mini{--c0:#ff9a90;--c1:#e02229;--c2:#8c0a12;position:absolute;width:var(--s);height:var(--s);pointer-events:none}
.mini{position:relative;width:34px;height:34px;display:inline-block}
.p.y,.mini.y{--c0:#fff7ae;--c1:#fbc412;--c2:#c28200}
.p::before,.mini::before{content:"";position:absolute;inset:4%;border-radius:50%;background:radial-gradient(ellipse 28% 20% at 32% 22%,rgba(255,255,255,.65),transparent),radial-gradient(circle at 38% 32%,var(--c0),var(--c1) 45%,var(--c2) 100%);box-shadow:0 2px 4px rgba(0,0,0,.35)}
.p::after,.mini::after{content:"";position:absolute;inset:23%;border-radius:50%;background:radial-gradient(circle at 60% 70%,rgba(255,255,255,.14),rgba(0,0,0,.2));box-shadow:inset 0 3px 5px rgba(0,0,0,.4),0 1px 1px rgba(255,255,255,.4)}
.p.d{animation:drop var(--t) both}
@keyframes drop{0%{transform:translateY(calc(var(--d)*-1));animation-timing-function:cubic-bezier(.5,0,.9,.6)}
62%{transform:none;animation-timing-function:ease-out}
76%{transform:translateY(calc(var(--s)*-.14));animation-timing-function:ease-in}
88%{transform:none;animation-timing-function:ease-out}
94%{transform:translateY(calc(var(--s)*-.04));animation-timing-function:ease-in}100%{transform:none}}
#ghost{z-index:3;top:calc(var(--s)*-1);opacity:0;transition:left .08s,opacity .15s}
#ghost.on{opacity:.6}
#conf{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
#conf b{position:absolute;top:-20px;width:9px;height:14px;animation:fall var(--t) linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(720deg)}}
.hint{font-size:12px;color:var(--mut);text-align:center;max-width:420px}
</style></head><body>
<div id="app">
<div class="logo"><span class="mini r"></span><h1>Dört Dörtlük</h1><span class="mini y"></span></div>
<div class="row">
 <div class="seg" id="modeSeg"><button data-m="bot" class="on">🤖 Bota karşı</button></div>
 <div class="seg" id="lvlSeg"><button data-l="1">Kolay</button><button data-l="2" class="on">Orta</button><button data-l="3">Zor</button></div>
</div>
<div class="players">
 <div class="pl r" id="c1"><span class="mini r"></span><div class="t"><span id="n1">Kırmızı</span><b id="s1">0</b></div></div>
 <div class="dr">Berabere<b id="s0">0</b></div>
 <div class="pl y" id="c2"><span class="mini y"></span><div class="t"><span id="n2">Sarı</span><b id="s2">0</b></div></div>
</div>
<div id="st"></div>
<div id="field">
 <div id="back"></div><div id="pieces"></div><div class="p r" id="ghost"></div>
 <div id="bw"><div id="board"></div></div><div id="rims"></div><div id="hl"></div><div id="cols"></div>
 <i class="foot l"></i><i class="foot rr"></i>
</div>
<div class="row" style="margin-top:14px">
 <button class="btn go" id="newBtn">Yeni oyun</button>
 <button class="btn" id="snd">🔊 Ses açık</button>
</div>
<div class="hint">Bir sütuna dokun/tıkla veya 1–7 tuşlarına bas. Yatay, dikey ya da çapraz 4 taşı dizen kazanır.</div>
</div>
<div id="conf"></div>
<script>
const R=6,C=7,$=id=>document.getElementById(id);
let b,turn,over,busy,gid=0,mode='bot',lvl=2,starter=1,hover=-1,els,score;
let ac,muted=false;
function A(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,t,d,type='sine',v=.2,f2){const a=A();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.02)}
const sfx={
 drop:()=>tone(700,0,.18,'sine',.05,260),
 land:()=>{tone(170,0,.14,'sine',.55,55);tone(950,0,.05,'triangle',.12,420)},
 err:()=>tone(120,0,.18,'sawtooth',.12,80),
 click:()=>tone(520,0,.06,'square',.05),
 win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.12,.35,'triangle',.22)),
 lose:()=>[392,349,311,262].forEach((f,i)=>tone(f,i*.2,.4,'sawtooth',.1)),
 draw:()=>[330,330,294].forEach((f,i)=>tone(f,i*.16,.22,'square',.08))
};
// board DOM
$('rims').innerHTML='<i></i>'.repeat(R*C);
const cols=$('cols');
for(let c=0;c<C;c++){const d=document.createElement('div');d.setAttribute('aria-label','Sütun '+(c+1));
 d.onpointerenter=d.onpointermove=()=>{hover=c;ghost()};d.onpointerleave=()=>{hover=-1;ghost()};
 d.onclick=()=>play(c);cols.appendChild(d)}
function ghost(){const g=$('ghost');g.className='p '+(turn==1?'r':'y')+(hover>=0&&!over&&!busy&&!botTurn()?' on':'');if(hover>=0)g.style.left=`calc(var(--s)*${hover})`}
const botTurn=()=>mode==='bot'&&turn===2;
function names(){return mode==='bot'?['Sen (Kırmızı)','Bot (Sarı)']:['Kırmızı','Sarı']}
function status(msg){GO.set(!over);const n=names();$('n1').textContent=n[0];$('n2').textContent=n[1];
 $('c1').classList.toggle('act',!over&&turn==1);$('c2').classList.toggle('act',!over&&turn==2);
 $('st').textContent=msg||(botTurn()?'Bot düşünüyor…':'Sıra: '+n[turn-1]);
 ['0','1','2'].forEach(k=>$('s'+k).textContent=score[k])}
function reset(){gid++;b=Array.from({length:R},()=>Array(C).fill(0));els=Array.from({length:R},()=>Array(C).fill(null));
 over=false;busy=false;turn=starter;$('pieces').innerHTML='';$('hl').innerHTML='';$('conf').innerHTML='';status();ghost();maybeBot()}
function freeRow(bd,c){for(let r=R-1;r>=0;r--)if(!bd[r][c])return r;return -1}
function line(bd,r,c,p){const out=[];for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const cells=[[r,c]];
 for(const s of[1,-1]){let y=r+dr*s,x=c+dc*s;while(y>=0&&y<R&&x>=0&&x<C&&bd[y][x]===p){cells.push([y,x]);y+=dr*s;x+=dc*s}}
 if(cells.length>=4)out.push(...cells)}return out.length?out:null}
function play(c){A();if(over||busy||botTurn())return;place(c)}
function place(c){const r=freeRow(b,c);
 if(r<0){sfx.err();const f=$('field');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');return}
 const p=turn,id=gid;b[r][c]=p;busy=true;ghost();
 const e=document.createElement('div'),T=520+r*60;
 e.className='p d '+(p==1?'r':'y');e.style.cssText=`left:calc(var(--s)*${c});top:calc(var(--s)*${r});--d:calc(var(--s)*${r+1});--t:${T}ms`;
 $('pieces').appendChild(e);els[r][c]=e;sfx.drop();
 setTimeout(()=>{if(id===gid)sfx.land()},T*.62);
 setTimeout(()=>{if(id!==gid)return;
  const w=line(b,r,c,p);
  if(w){over=true;w.forEach(([y,x])=>{const h=document.createElement('i');h.style.cssText=`left:calc(var(--s)*${x});top:calc(var(--s)*${y})`;$('hl').appendChild(h)});score[p]++;
   const n=names()[p-1];
   if(mode==='bot'){p==1?(sfx.win(),confetti(),status('🎉 Tebrikler, sen kazandın!')):(sfx.lose(),status('🤖 Bot kazandı!'))}
   else{sfx.win();confetti();status(`🎉 ${n} kazandı!`)}
  }else if(b[0].every(v=>v)){over=true;score[0]++;sfx.draw();status('🤝 Berabere!')}
  else{turn=3-turn;busy=false;status();ghost();maybeBot()}
  busy=over?false:busy;if(over)ghost()},T);
}
function confetti(){const q=$('conf'),cl=['#e5322d','#fdc82f','#1e56c8','#2fbf71','#fff'];
 for(let i=0;i<70;i++){const k=document.createElement('b');k.style.cssText=`left:${Math.random()*100}%;background:${cl[i%5]};--x:${(Math.random()-.5)*200}px;--t:${1800+Math.random()*1800}ms;animation-delay:${Math.random()*500}ms`;q.appendChild(k)}
 setTimeout(()=>{q.innerHTML=''},4200)}
// ---- Bot ----
const ORD=[3,2,4,1,5,0,6],W=[];
for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){
 const er=r+3*dr,ec=c+3*dc;if(er<0||er>=R||ec<0||ec>=C)continue;W.push([0,1,2,3].map(i=>[r+dr*i,c+dc*i]))}
function ev(bd,p){const o=3-p;let s=0;for(let r=0;r<R;r++)if(bd[r][3]===p)s+=3;else if(bd[r][3]===o)s-=3;
 for(const w of W){let a=0,d=0;for(const[y,x]of w){const v=bd[y][x];if(v===p)a++;else if(v===o)d++}
  if(a&&d)continue;if(a===3)s+=6;else if(a===2)s+=2;if(d===3)s-=7;else if(d===2)s-=2}return s}
function nm(bd,d,al,be,p){let any=false,best=-1e9;
 for(const c of ORD){const r=freeRow(bd,c);if(r<0)continue;any=true;bd[r][c]=p;let v;
  if(line(bd,r,c,p))v=1e5+d;else if(d<=1)v=-ev(bd,3-p);else v=-nm(bd,d-1,-be,-al,3-p);
  bd[r][c]=0;if(v>best)best=v;if(best>al)al=best;if(al>=be)break}
 return any?best:0}
function botMove(){const valid=ORD.filter(c=>freeRow(b,c)>=0);
 if(lvl===1&&Math.random()<.25)return valid[Math.random()*valid.length|0];
 const d={1:2,2:4,3:5}[lvl];let best=-1e9,mv=[];
 for(const c of valid){const r=freeRow(b,c);b[r][c]=2;let v;
  if(line(b,r,c,2))v=1e6;else v=-nm(b,d-1,-1e9,1e9,1);b[r][c]=0;
  if(v>best){best=v;mv=[c]}else if(v===best)mv.push(c)}
 return mv[Math.random()*mv.length|0]}
function maybeBot(){if(mode!=='bot'||over||turn!==2)return;const id=gid;busy=true;
 setTimeout(()=>{if(id!==gid)return;busy=false;place(botMove())},550)}
// ---- UI ----
function newScore(){score={0:0,1:0,2:0}}
$('newBtn').onclick=()=>{sfx.click();if(over)starter=3-starter;reset()};
$('snd').onclick=()=>{muted=!muted;$('snd').textContent=muted?'🔇 Ses kapalı':'🔊 Ses açık';if(!muted){A();sfx.click()}};
document.querySelectorAll('#modeSeg button').forEach(x=>x.onclick=()=>{A();sfx.click();mode=x.dataset.m;
 document.querySelectorAll('#modeSeg button').forEach(y=>y.classList.toggle('on',y===x));
 $('lvlSeg').style.display=mode==='bot'?'flex':'none';newScore();starter=1;reset()});
document.querySelectorAll('#lvlSeg button').forEach(x=>x.onclick=()=>{A();sfx.click();lvl=+x.dataset.l;
 document.querySelectorAll('#lvlSeg button').forEach(y=>y.classList.toggle('on',y===x));newScore();starter=1;reset()});
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='7')play(+e.key-1);else if(e.key==='n'||e.key==='N')$('newBtn').click()});
newScore();reset();
</script></body></html>
