<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<script>(function(){try{if(localStorage.getItem('gameon.sound')==='0'){const c=AudioNode.prototype.connect;AudioNode.prototype.connect=function(d){if(typeof AudioDestinationNode!=='undefined'&&d instanceof AudioDestinationNode)return d;return c.apply(this,arguments)}}}catch(e){}})();</script>
<script>const GO={on:null,set(v,r){v=!!v;if(this.on===v)return;this.on=v;try{parent.postMessage({gameon:v?'start':'end',ranking:r},'*')}catch(e){}}};</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>UNO</title>
<style>
:root{color-scheme:dark;--cw:clamp(56px,17vw,86px);--ink:#eaf2ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;
 background:radial-gradient(ellipse at 50% 42%,#1f8a5b 0,#0f5a3d 45%,#06281c 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
 background:repeating-conic-gradient(from 45deg at 50% 50%,#fff 0 6deg,transparent 6deg 12deg)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#opps{display:flex;justify-content:space-around;gap:6px;padding:44px 6px 0;flex:0 0 auto}
.opp{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;flex:1;max-width:34%}
.pl{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border-radius:999px;background:rgba(0,0,0,.35);border:2px solid transparent;max-width:100%}
.pl img{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
.pl b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl i{font-style:normal;font-size:11px;font-weight:800;background:#fff;color:#111;border-radius:999px;padding:1px 7px;flex:none}
.opp.act .pl,#me.act .pl{border-color:#fde047;box-shadow:0 0 14px #fde047aa}
.fan{display:flex;height:calc(var(--cw)*.7);align-items:flex-end;justify-content:center;max-width:100%;overflow:hidden}
.fan img{width:calc(var(--cw)*.42);margin-left:calc(var(--cw)*-.22);filter:drop-shadow(0 2px 3px #0008)}
.fan img:first-child{margin-left:0}
#mid{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(14px,6vw,34px);position:relative}
#deck{position:relative;width:calc(var(--cw)*1.15);cursor:pointer}
#deck img{width:100%;display:block;filter:drop-shadow(0 6px 8px #000a)}
#deck:after{content:attr(data-n);position:absolute;right:-6px;top:-8px;background:#111c;border-radius:999px;font:800 11px system-ui;padding:2px 7px}
#deck.can{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.07);filter:drop-shadow(0 0 14px #fde047)}}
#disc{position:relative;width:calc(var(--cw)*1.15)}
#disc img{width:100%;display:block;filter:drop-shadow(0 6px 8px #000a);animation:drop .28s ease-out}
@keyframes drop{from{transform:translateY(-22px) rotate(-8deg) scale(1.15);opacity:.5}}
#ring{position:absolute;inset:-10px;border-radius:16px;border:5px solid var(--cc,#888);box-shadow:0 0 22px var(--cc,#888);pointer-events:none;opacity:.95}
#dir{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font-size:20px;opacity:.85}
#side{display:flex;flex-direction:column;gap:10px;align-items:center}
.rb{border:0;border-radius:50%;width:54px;height:54px;font-size:25px;color:#fff;cursor:pointer;box-shadow:0 4px 0 #0006,0 8px 14px #0006;background:linear-gradient(#f59e0b,#d97706)}
.rb:active{transform:translateY(3px)}
#bell.hot{animation:ring .5s infinite;background:linear-gradient(#ef4444,#b91c1c)}
@keyframes ring{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
#bellcd{font-size:12px;font-weight:800;color:#fde047;min-height:14px}
#status{text-align:center;font-size:13px;font-weight:700;min-height:18px;padding:2px 8px;text-shadow:0 1px 3px #000}
#bar{display:flex;justify-content:center;gap:10px;min-height:44px;align-items:center}
#pass{display:none;border:0;border-radius:14px;padding:10px 26px;font:900 15px system-ui;color:#fff;background:linear-gradient(#ef4444,#b91c1c);box-shadow:0 4px 0 #7f1d1d;cursor:pointer}
#pass.on{display:block}
#me{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
#hand{display:flex;justify-content:safe center;align-items:flex-end;overflow-x:auto;overflow-y:visible;width:100%;padding:16px 14px 8px;min-height:calc(var(--cw)*1.5 + 24px);scrollbar-width:none}
#hand::-webkit-scrollbar{display:none}
.card{flex:none;width:var(--cw);margin-left:calc(var(--cw)*-.38);filter:drop-shadow(0 3px 5px #000a);transition:transform .15s;cursor:pointer}
.card:first-child{margin-left:0}
.card.ok{transform:translateY(-14px)}
.card.no{filter:brightness(.55) drop-shadow(0 3px 5px #000a)}
#hand.few .card{margin-left:6px}#hand.few .card:first-child{margin-left:0}
.bub{position:absolute;z-index:20;left:50%;transform:translateX(-50%);top:-6px;max-width:200px;background:#fff;color:#111;border-radius:14px;padding:6px 10px;font:700 13px system-ui;box-shadow:0 4px 12px #0008;animation:pop .2s ease-out;pointer-events:none;word-break:break-word;text-align:center}
.bub:after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:inherit}
.bub.stk{background:transparent;box-shadow:none;padding:0}.bub.stk:after{display:none}.bub.stk img{width:150px;display:block;filter:drop-shadow(0 4px 8px #000a)}
.bub.pass{background:#fde047;font-weight:900;letter-spacing:1px}
#me .bub{top:-34px}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
#cbtn{width:42px;height:42px;font-size:20px;flex:none}
#chat{position:absolute;left:0;right:0;bottom:0;z-index:40;background:#0b1226f2;border-top:1px solid #3b82f655;border-radius:18px 18px 0 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:8px}
#chat.on{display:flex}
#stk{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}#stk::-webkit-scrollbar{display:none}
#stk img{height:42px;flex:none;border-radius:10px;cursor:pointer;filter:drop-shadow(0 2px 4px #0008)}
#stk.cd img{opacity:.4}
#emo{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}#emo button{flex:none;border:0;background:#1b2a4a;border-radius:10px;font-size:20px;padding:4px 8px}
#crow{display:flex;gap:8px}
#cin{flex:1;min-width:0;border:1px solid #3b82f666;border-radius:12px;background:#10203f;color:#fff;padding:10px;font:600 15px system-ui;outline:0}
#csend{border:0;border-radius:12px;padding:0 14px;min-width:74px;font:800 14px system-ui;color:#fff;background:linear-gradient(#3b82f6,#1d4ed8)}
#csend:disabled{background:#334155}
#cx{position:absolute;right:10px;top:-34px;border:0;background:#0b1226;color:#fff;border-radius:12px;padding:6px 12px;font:800 12px system-ui}
#pick{position:fixed;inset:0;z-index:60;background:#000b;display:none;align-items:center;justify-content:center}
#pick.on{display:flex}#pick div{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:#0b1226;padding:18px;border-radius:20px}
#pick button{width:90px;height:90px;border-radius:20px;border:4px solid #fff5;cursor:pointer}
#toast{position:fixed;left:50%;top:38%;transform:translateX(-50%);z-index:70;background:#000c;color:#fff;font:800 14px system-ui;padding:8px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;max-width:80vw}
#toast.on{opacity:1}
#end{position:fixed;inset:0;z-index:65;background:#000c;display:none;align-items:center;justify-content:center;padding:18px}
#end.on{display:flex}
.ecard{background:linear-gradient(#14213d,#0a1020);border:1px solid #1e3a8a;border-radius:20px;padding:20px;width:100%;max-width:340px;text-align:center}
.ecard h1{font-size:26px;margin-bottom:10px}
.rk{display:flex;align-items:center;gap:10px;background:#ffffff10;border-radius:12px;padding:6px 10px;margin-bottom:6px;text-align:left;font-weight:800;font-size:14px}
.rk img{width:30px;height:30px;border-radius:50%}.rk span{margin-left:auto;color:#fde047;font-size:13px}
.ecard button{display:block;width:100%;margin-top:8px;padding:12px;border-radius:12px;border:0;font:800 15px system-ui;color:#fff;background:linear-gradient(#3b82f6,#1d4ed8);cursor:pointer}
.ecard small{display:block;color:#9fb4d8;margin-top:6px;font-size:12px}
@media (orientation:landscape) and (max-height:520px){:root{--cw:clamp(40px,10vh,56px)}#opps{padding-top:4px}#mid{gap:20px}#hand{padding:8px 14px 2px;min-height:calc(var(--cw)*1.5 + 6px)}#bar{min-height:34px}#pass{padding:6px 20px}#dir{display:none}.rb{width:42px;height:42px;font-size:20px}#status{font-size:12px}}
</style>
</head>
<body>
<div id="app">
  <div id="opps"></div>
  <div id="mid">
    <div id="deck" data-n="0"><img src="../assets/uno/arka.webp" alt="deste"></div>
    <div id="disc"><div id="ring"></div><img id="topimg" src="../assets/uno/arka.webp" alt=""><div id="dir">↻</div></div>
    <div id="side"><button class="rb" id="bell" title="Zil">🔔</button><div id="bellcd"></div></div>
  </div>
  <div id="status">Oyun yükleniyor…</div>
  <div id="bar"><button class="rb" id="cbtn" style="background:linear-gradient(#3b82f6,#1d4ed8)">💬</button><button id="pass">PASS</button></div>
  <div id="me"><div class="pl" id="mepl"></div><div id="hand"></div></div>
</div>
<div id="chat">
  <button id="cx">Kapat ✕</button>
  <div id="stk"></div>
  <div id="emo"></div>
  <div id="crow"><input id="cin" maxlength="80" placeholder="Mesaj yaz…" autocomplete="off"><button id="csend">Gönder</button></div>
</div>
<div id="pick"><div></div></div>
<div id="toast"></div>
<div id="end"><div class="ecard" id="ecard"></div></div>

<script>
const $=id=>document.getElementById(id);
const CN=['kirmizi','sari','yesil','mavi'],CC=['#ef4444','#facc15','#22c55e','#3b82f6'],STK=['basliyorum','sahibi','curret','yenilmeye','uno','cay'];
const post=o=>{try{parent.postMessage(o,'*')}catch(e){}},esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ROOM=new URLSearchParams(location.search).get('room');
function file(k){if(k>=100)return(k<104?'siyah_renk_secici_':'siyah_arti4_')+((k-100)%4+1);const c=k/25|0,i=k%25;let n;
 if(i===0)n='0_1';else if(i<=18)n=(((i-1)>>1)+1)+'_'+(((i-1)&1)+1);else if(i<=20)n='engelle_'+(i-19);else if(i<=22)n='yon_degistir_'+(i-21);else n='arti2_'+(i-23);return CN[c]+'_'+n}
const src=k=>'../assets/uno/'+file(k)+'.webp';
let S=null,ME=0,lastEv=null,lastChat=null,handKey='',cdUntil=0,rpcN=0,pickCb=null,topK=-1;const rpcW={};
const rpc=(path,body)=>new Promise(res=>{const id=++rpcN;rpcW[id]=res;post({gameon:'rpc',id,method:'POST',path,body});setTimeout(()=>{if(rpcW[id]){delete rpcW[id];res(null)}},10000)});
const toast=(m)=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1500)};
function beep(f,d){try{const a=beep.a||(beep.a=new (window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
async function act(path,body){const r=await rpc('/uno/'+path,body||{});if(r){if(r.room)apply(r.room);if(r.error&&r.error!=='wait'){toast({illegal:'Bu hamle yapılamaz',not_your_turn:'Sıra sende değil',no_pending:'Şu an zile basmana gerek yok',ended:'Oyun bitti'}[r.error]||'Hata')}}return r}
const P=s=>S.players[s],nm=p=>p.username?'@'+p.username:(p.first_name||'Oyuncu');

/* ---------- baloncuklar ---------- */
function bubble(seat,content,cls){const host=seat===ME?$('me'):document.querySelector('.opp[data-s="'+seat+'"]');if(!host)return;
 host.querySelectorAll('.bub').forEach(b=>b.remove());const b=document.createElement('div');b.className='bub '+(cls||'');
 if(content.sticker){b.className='bub stk';b.innerHTML='<img src="../assets/stk/'+content.sticker+'.webp" alt="">'}else b.textContent=content.text||content;
 host.appendChild(b);setTimeout(()=>b.remove(),content.sticker?5200:4200)}

/* ---------- çizim ---------- */
function apply(room){S=room;const u=room.uno;if(!u)return;
 if(lastEv===null){lastEv=u.evn;lastChat=u.chat.length?u.chat[u.chat.length-1].id:0;if(room.status==='playing')GO.set(true)}
 const n=u.n,order=[...Array(n).keys()].map(i=>(ME+i)%n);
 // rakipler
 const opps=$('opps');if(opps.dataset.k!==order.join()+room.players.map(p=>p.id).join()){opps.dataset.k=order.join()+room.players.map(p=>p.id).join();opps.innerHTML=order.slice(1).map(s=>'<div class="opp" data-s="'+s+'"><div class="pl"><img src="../profil/'+(P(s).avatar||'profil1')+'.webp" alt=""><b>'+esc(nm(P(s)))+'</b><i></i></div><div class="fan"></div></div>').join('')}
 order.slice(1).forEach(s=>{const el=opps.querySelector('[data-s="'+s+'"]'),c=u.counts[s];el.classList.toggle('act',u.turn===s&&room.status==='playing');el.querySelector('i').textContent=c;
  const f=el.querySelector('.fan'),k=Math.min(c,n>3?5:8);if(f.children.length!==k)f.innerHTML=Array.from({length:k},()=>'<img src="../assets/uno/arka.webp" alt="">').join('')});
 const me=P(ME);$('mepl').innerHTML='<img src="../profil/'+(me.avatar||'profil1')+'.webp" alt=""><b>'+esc(nm(me))+'</b><i>'+u.counts[ME]+'</i>';$('me').classList.toggle('act',u.turn===ME&&room.status==='playing');
 // orta
 if(topK!==u.top){topK=u.top;const im=$('topimg');im.style.animation='none';void im.offsetWidth;im.style.animation='';im.src=src(u.top)}
 $('ring').style.setProperty('--cc',CC[u.color]);$('dir').textContent=u.dir>0?'↻':'↺';$('deck').dataset.n=u.deckN;$('deck').classList.toggle('can',u.canDraw);
 const pd=u.pending;$('bell').classList.toggle('hot',!!pd);$('bellcd').textContent=pd?(pd.seat===ME?'UNO! diyerek bas ':'Yakala ')+Math.ceil(pd.left)+'s':'';
 $('pass').classList.toggle('on',u.canPass);
 $('status').textContent=room.status==='done'?'Oyun bitti':u.turn===ME?(u.canPass?'Atacak kartın yok — PASS de':u.drawn!=null?'Çektiğin kartı atabilirsin':'Sıra sende: kart at ya da desteden çek'):'Sıra: '+nm(P(u.turn));
 // el
 const key=u.hand.join()+'|'+u.legal.join()+'|'+(u.turn===ME);
 if(key!==handKey){handKey=key;const my=u.turn===ME&&room.status==='playing';$('hand').className=u.hand.length<=6?'few':'';
  $('hand').innerHTML=u.hand.map(k=>'<img class="card '+(my?(u.legal.includes(k)?'ok':'no'):'')+'" data-k="'+k+'" src="'+src(k)+'" alt="">').join('')}
 // olaylar
 u.ev.filter(e=>e.i>lastEv).forEach(e=>{lastEv=e.i;
  if(e.t==='pass')bubble(e.seat,'PASS','pass');
  else if(e.t==='uno'){bubble(e.seat,'UNO!','pass');beep(880,.25)}
  else if(e.t==='catch'){bubble(e.seat,'Yakalandı! +4','pass');toast(nm(P(e.seat))+' UNO demedi: +4 kart');beep(200,.3)}
  else if(e.t==='penalty'){bubble(e.seat,'Zile basmadı! +4','pass');toast(nm(P(e.seat))+' zile basmadı: +4 kart');beep(200,.3)}
  else if(e.t==='draw'&&e.n>1){bubble(e.seat,'+'+e.n,'pass')}
  else if(e.t==='skip')toast('⛔ '+nm(P(e.seat))+' atlandı');
  else if(e.t==='reverse')toast('🔄 Yön değişti');
  else if(e.t==='play'){beep(520,.07)}});
 u.chat.filter(m=>m.id>lastChat).forEach(m=>{lastChat=m.id;bubble(m.seat,m.sticker?{sticker:m.sticker}:{text:m.text})});
 if(room.status==='done')showEnd(room)}

function showEnd(room){const u=room.uno,rk=[u.winner,...[...Array(u.n).keys()].filter(s=>s!==u.winner).sort((a,b)=>(u.left[a]-u.left[b])||a-b)];
 const my=P(ME).id,pts=room.points||{},note=room.notes&&room.notes[String(my)];
 $('ecard').innerHTML='<h1>'+(u.winner===ME?'🏆 Kazandın!':'🎴 Oyun bitti')+'</h1>'+rk.map((s,i)=>'<div class="rk"><b>'+(i+1)+'.</b><img src="../profil/'+(P(s).avatar||'profil1')+'.webp" alt="">'+esc(nm(P(s)))+'<span>'+(i?u.left[s]+' puan elde':'bitirdi')+(pts[String(P(s).id)]?' · +'+pts[String(P(s).id)]+'⭐':'')+'</span></div>').join('')+
  (room.bots?'<small>Botlu oyunda puan verilmez</small>':note?'<small>'+{short:'Oyun çok kısa sürdü: puan verilmedi',pair:'Aynı oyuncularla günlük puan sınırı doldu',cap:'Günlük puan sınırına ulaştın'}[note]+'</small>':'')+
  '<button data-c="x">Kapat</button><small>Aynı kişilerle tekrar için üstteki “🔁 Rövanş” düğmesine bas</small>';
 $('end').classList.add('on');GO.set(false)}
$('ecard').onclick=e=>{const c=e.target.dataset.c;if(!c)return;if(c==='x')$('end').classList.remove('on');else post({gameon:'newgame',choice:c})};

/* ---------- etkileşim ---------- */
$('hand').onclick=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k===undefined||!S)return;const kk=+k,u=S.uno;
 if(u.turn!==ME)return toast('Sıra sende değil');
 if(!u.legal.includes(kk))return toast(kk>=104?'+4 sadece rengin yoksa atılır':u.drawn!=null?'Sadece çektiğin kartı atabilirsin':'Bu kartı atamazsın');
 if(kk>=100){$('pick').classList.add('on');pickCb=c=>act('play',{card:kk,color:c})}else act('play',{card:kk})};
$('pick').firstElementChild.innerHTML=CC.map((c,i)=>'<button data-c="'+i+'" style="background:'+c+'"></button>').join('');
$('pick').onclick=e=>{const c=e.target.dataset.c;$('pick').classList.remove('on');if(c!==undefined&&pickCb)pickCb(+c);pickCb=null};
$('deck').onclick=()=>{if(!S)return;const u=S.uno;if(u.canDraw)act('draw');else toast(u.turn!==ME?'Sıra sende değil':'Bu turda zaten kart çektin')};
$('pass').onclick=()=>act('pass');
$('bell').onclick=()=>{beep(990,.15);act('bell')};
// sohbet
$('stk').innerHTML=STK.map(s=>'<img src="../assets/stk/'+s+'.webp" data-s="'+s+'" alt="">').join('');
$('emo').innerHTML=['😀','😂','😡','😎','👍','😭','🔥','🎉','🤔','😴'].map(e=>'<button>'+e+'</button>').join('');
$('emo').onclick=e=>{if(e.target.tagName==='BUTTON'){const i=$('cin');i.value=(i.value+e.target.textContent).slice(0,80);i.focus()}};
$('cbtn').onclick=()=>$('chat').classList.toggle('on');$('cx').onclick=()=>$('chat').classList.remove('on');
async function sendChat(body){const left=Math.ceil((cdUntil-Date.now())/1000);if(left>0)return toast('⏱ '+left+' sn bekle');
 const r=await act('chat',body);if(r&&r.ok){cdUntil=Date.now()+5000;$('cin').value='';$('chat').classList.remove('on')}else if(r&&r.error==='wait'){cdUntil=Date.now()+r.wait*1000}}
$('stk').onclick=e=>{if(e.target.dataset.s)sendChat({sticker:e.target.dataset.s})};
$('csend').onclick=()=>{const t=$('cin').value.trim();if(t)sendChat({text:t})};
$('cin').onkeydown=e=>{if(e.key==='Enter')$('csend').click()};
setInterval(()=>{const left=Math.ceil((cdUntil-Date.now())/1000),b=$('csend');b.disabled=left>0;b.textContent=left>0?'⏱ '+left:'Gönder';$('stk').classList.toggle('cd',left>0)},250);

addEventListener('message',e=>{const d=e.data||{};if(e.source!==parent)return;
 if(d.gameon==='rpc-res'){const f=rpcW[d.id];if(f){delete rpcW[d.id];f(d.res)}}
 else if(d.gameon==='init'){ME=d.me|0;if(d.state)apply(d.state)}
 else if(d.gameon==='state'&&d.s)apply(d.s)});
post({gameon:'ready'});
</script>
</body>
</html>
