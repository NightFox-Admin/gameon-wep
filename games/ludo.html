$('#roll').onclick=()=>{if(phase==='roll'&&isH(turn)&&rollGo){phase='rolling';rollGo()}};
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*640,y=(e.clientY-r.top)/r.height*720;
 if(phase==='roll'&&isH(turn)&&Math.hypot(x-DX,y-DY)<60)return $('#roll').onclick();
 if(phase==='pick'&&pickGo){let b=null,bd=34;hl.forEach(t=>{const d=Math.hypot(x-(BX+t.x*CS),y-(BY+t.y*CS-4));if(d<bd){bd=d;b=t}});if(b){const f=pickGo;pickGo=null;f(b)}}});
document.querySelectorAll('#o1 button,#o2 button').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');if(b.parentNode.id==='o1')cfg.n=+b.dataset.v;else cfg.local=b.dataset.v==='1'});
$('#go').onclick=()=>{$('#setup').classList.remove('on');newGame()};$('#nb').onclick=()=>$('#setup').classList.add('on');$('#mb').onclick=()=>{$('#modal').classList.remove('on');$('#setup').classList.add('on')};
// ---- Telegram Mini App
const TG=(()=>{try{return parent.Telegram&&parent.Telegram.WebApp}catch(e){return null}})();
try{screen.orientation.lock('portrait').catch(()=>{})}catch(e){}
addEventListener('message',e=>{const d=e.data||{};if(e.source!==parent)return;
 if(d.gameon==='init'){M=d.me|0;(d.players||[]).forEach((p,i)=>{NAMES[i]=p.username?'@'+p.username:(p.first_name||'Oyuncu');PA[i]=p.avatar||'profil1'});cfg.n=4;cfg.local=false;newGame()}
 else if(d.gameon==='remote'&&d.data)rq.push(d.data)});
(function(){const b=$('#mb');b.textContent='🏠 Oda Kur';b.onclick=()=>post({gameon:'newgame',choice:'room'});if(ROOM){const x=document.createElement('button');x.textContent='🤖 Botlarla Oyna';x.onclick=()=>post({gameon:'newgame',choice:'bot'});b.after(x)}
 $('#nb').onclick=()=>{if(ROOM&&!over)return ui('Oyun bitince yeni oyun açabilirsin');if(ROOM){$('#mt').textContent='Yeni oyun';$('#modal').classList.add('on')}else $('#setup').classList.add('on')}})();
fit();requestAnimationFrame(frame);
if(ROOM){ACT=[0,1,2,3];T=[0,1,2,3].map(i=>[0,1,2,3].map(k=>({i,k,p:0,x:BS[i][k][0],y:BS[i][k][1],z:0,free:1})));layout();turn=0;over=true;post({gameon:'ready'})}
else{try{NAMES[3]=localStorage.getItem('gameon.name')||'Sen'}catch(e){}newGame();GO.set(false);$('#setup').classList.add('on')}
</script></body></html>
