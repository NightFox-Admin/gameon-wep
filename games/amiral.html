#app{max-width:1000px;margin:0 auto;padding:12px;text-align:center}
h1{margin:8px 0;letter-spacing:.12em;font-size:clamp(1.6rem,6vw,2.6rem);text-shadow:0 2px 12px #000a}
h2{margin:6px 0;font-size:1.1rem}
.sub{color:var(--mu);font-size:.9rem;margin:2px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px auto;max-width:460px;text-align:left}
.card label{display:flex;gap:8px;align-items:center;margin:8px 0}
.card input[type=text],select{background:#0a2238;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;font-size:1rem}
button{background:linear-gradient(#f7c562,#d99a21);color:#1a1200;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:1rem;cursor:pointer;margin:4px}
button.sec{background:#17415f;color:var(--tx);border:1px solid var(--line)}
button.on{outline:3px solid #fff8}
button:disabled{opacity:.4;cursor:default}
.seg{display:flex;gap:6px}.seg button{flex:1;margin:0}
.boards{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px}
.bw{--bs:min(94vw,58vh,560px);width:var(--bs);margin:4px auto}

.c.m:after{content:"";position:absolute;inset:22%;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 4px #fff5,inset 0 0 6px #fff8;animation:rip .6s ease-out}
.c.h:after{content:"";position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle,#fff6a8 0,#ffb020 30%,#e8523a 60%,#6b1a0e00 75%);animation:pop .4s ease-out;box-shadow:0 0 12px #ff7a2a}
.c.h:before{content:"";position:absolute;left:30%;top:-10%;width:40%;height:60%;background:radial-gradient(#2228,transparent 70%);filter:blur(2px);z-index:1}
@keyframes pop{from{transform:scale(.2)}}@keyframes rip{from{transform:scale(.3);opacity:0}}
.c.pv{background:#5fe08a66}.c.bad{background:#ff4a4a77}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0}
.tray button{display:flex;flex-direction:column;align-items:center;gap:2px;background:#10375a;color:var(--tx);border:1px solid var(--line);padding:6px 8px;font-size:.75rem;font-weight:600}
.tray button.on{background:#1d5b8c;outline:2px solid var(--ac)}.tray button.done{opacity:.45}
.tray svg{height:26px;width:calc(26px*var(--l)*1)}
.msg{min-height:2.6em;margin:6px auto;padding:8px 12px;background:#0a2238;border:1px solid var(--line);border-radius:10px;max-width:560px;font-weight:600}
.fleet{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:2px 0;font-size:.75rem}
.fleet span{padding:2px 7px;border-radius:99px;background:#10375a;border:1px solid var(--line)}.fleet .x{text-decoration:line-through;color:var(--red);opacity:.8}
.log{font-size:.78rem;color:var(--mu);max-width:560px;margin:4px auto}
.ov{position:fixed;inset:0;background:#04101d;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:8px}
.ov.win{background:#04101dd0}
.ov h1{font-size:clamp(1.4rem,6vw,2.4rem)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const ROOM=new URLSearchParams(location.search).get('mode')==='room';let M=0,PA=['profil1','profil1'],RK,lastT=-1,rq=[],started=false;
const post=o=>{try{parent.postMessage(o,'*')}catch(e){}},emit=ev=>{if(ROOM)post({gameon:'move',data:ev,next:ev.next})},esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),pav=i=>`<img src="../profil/${PA[i]}.webp" alt="" style="width:20px;height:20px;border-radius:50%;vertical-align:middle;margin-right:5px">`;
const $=s=>document.querySelector(s);
const SH=[["Uçak Gemisi",5],["Zırhlı",4],["Kruvazör",3],["Denizaltı",3],["Muhrip",2]];
const L="ABCDEFGHIJ";
let G={phase:"menu",o:{mode:"bot",diff:"normal",touch:false,extra:false,n1:"Oyuncu 1",n2:"Oyuncu 2"}};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const newP=(name,bot)=>({name,bot,ships:Array(5).fill(null),grid:Array.from({length:10},()=>Array(10).fill(0))});
const cellsOf=(s)=>Array.from({length:s.len},(_,k)=>[s.x+(s.v?0:k),s.y+(s.v?k:0)]);
function occ(p){const o=Array.from({length:10},()=>Array(10).fill(-1));p.ships.forEach((s,i)=>s&&cellsOf(s).forEach(([x,y])=>o[y][x]=i));return o}
function canPlace(p,i,x,y,v){const len=SH[i][1],o=occ(p);
 for(let k=0;k<len;k++){const cx=x+(v?0:k),cy=y+(v?k:0);if(cx>9||cy>9)return false;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const a=cx+dx,b=cy+dy;if(a<0||b<0||a>9||b>9)continue;
   const q=o[b][a];if(q===-1||q===i)continue;if(dx===0&&dy===0)return false;if(!G.o.touch)return false}}
 return true}
function place(p,i,x,y,v){p.ships[i]={x,y,v,len:SH[i][1],hits:0}}
function randomPlace(p){p.ships=Array(5).fill(null);for(let i=0;i<5;i++){let t=0;while(t++<500){const v=Math.random()<.5,x=Math.floor(Math.random()*10),y=Math.floor(Math.random()*10);if(canPlace(p,i,x,y,v)){place(p,i,x,y,v);break}}if(!p.ships[i])return randomPlace(p)}}

/* ---- Gemi çizimleri (üstten görünüm) ---- */
function shipSVG(i,len,v){const W=100*len;
 const tur=(cx,cy=50,r=15)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#5b6672" stroke="#2c343d" stroke-width="3"/><rect x="${cx}" y="${cy-4}" width="${r*2.2}" height="8" rx="3" fill="#2c343d"/><rect x="${cx}" y="${cy-4}" width="${r*2.2}" height="3" fill="#8793a0"/>`;
 let b;
 if(i===3){b=`<path d="M8,50 Q8,30 40,30 L${W-50},30 Q${W-6},38 ${W-6},50 Q${W-6},62 ${W-50},70 L40,70 Q8,70 8,50Z" fill="#2f3a46" stroke="#171d24" stroke-width="3"/><path d="M30,42 L${W-60},42" stroke="#4a5a6c" stroke-width="3"/><rect x="${W*.42}" y="37" width="56" height="26" rx="12" fill="#46556a" stroke="#171d24" stroke-width="3"/><rect x="${W*.42+34}" y="46" width="4" height="8" fill="#9fb2c6"/>`}
 else{b=`<path d="M12,50 Q12,24 36,22 L${W-70},22 Q${W-18},30 ${W-6},50 Q${W-18},70 ${W-70},78 L36,78 Q12,76 12,50Z" fill="#7d8996" stroke="#323b46" stroke-width="3"/><rect x="26" y="32" width="${W-96}" height="36" rx="10" fill="#a5afba"/><path d="M${W-60},34 Q${W-24},50 ${W-60},66" fill="none" stroke="#6d7884" stroke-width="3"/><rect x="8" y="42" width="10" height="16" rx="3" fill="#4a535d"/>`;
  if(i===0)b+=`<rect x="26" y="32" width="${W-96}" height="36" rx="10" fill="#8e99a5"/><path d="M40,50 L${W-90},50" stroke="#f5e27a" stroke-width="4" stroke-dasharray="16 10"/><path d="M${W*.55},33 L${W*.55+26},33" stroke="#fff" stroke-width="2"/><rect x="${W*.58}" y="22" width="64" height="14" rx="4" fill="#4b5563" stroke="#242b33" stroke-width="2"/><circle cx="${W*.58+14}" cy="29" r="4" fill="#e8523a"/>`;
  if(i===1)b+=tur(70)+tur(140)+tur(W-150)+`<rect x="${W/2-10}" y="38" width="50" height="24" rx="6" fill="#4b5563" stroke="#242b33" stroke-width="2"/><circle cx="${W/2+15}" cy="50" r="8" fill="#2c343d"/>`;
  if(i===2)b+=tur(66)+tur(W-130,50,14)+`<rect x="${W/2-14}" y="38" width="40" height="24" rx="6" fill="#4b5563" stroke="#242b33" stroke-width="2"/><circle cx="${W/2+6}" cy="50" r="7" fill="#2c343d"/>`;
  if(i===4)b+=tur(52,50,13)+`<circle cx="${W/2+10}" cy="50" r="11" fill="#3b444e" stroke="#1a1f25" stroke-width="2"/><rect x="${W-110}" y="40" width="28" height="20" rx="5" fill="#4b5563" stroke="#242b33" stroke-width="2"/>`}
 return v?`<svg viewBox="0 0 100 ${W}" preserveAspectRatio="none"><g transform="translate(100,0) rotate(90)">${b}</g></svg>`:`<svg viewBox="0 0 ${W} 100" preserveAspectRatio="none">${b}</svg>`}

/* ---- Tahta çizimi ---- */
function boardHTML(p,mode,act){
 const showAll=mode==="own"||mode==="all";
 let sh="";p.ships.forEach((s,i)=>{if(!s)return;if(!showAll&&s.hits<s.len)return;
  sh+=`<div class="ship" style="grid-column:${s.x+1}/span ${s.v?1:s.len};grid-row:${s.y+1}/span ${s.v?s.len:1}">${shipSVG(i,s.len,s.v)}</div>`});
 let c="";for(let y=0;y<10;y++)for(let x=0;x<10;x++){const g=p.grid[y][x];c+=`<div class="c ${g===1?"m":g===2?"h":""}" data-x="${x}" data-y="${y}"></div>`}
 return `<div class="bw ${mode==="own"&&G.phase==="battle"?"sm":""}"><div class="board ${act?"act":""}"><div class="gl">${sh}</div><div class="gl cells">${c}</div></div></div>`}
const fleetHTML=p=>`<div class="fleet">${p.ships.map((s,i)=>`<span class="${s&&s.hits>=s.len?"x":""}">${SH[i][0]} (${SH[i][1]})</span>`).join("")}</div>`;

/* ---- Ekranlar ---- */
function render(){let h="";const o=G.o;GO.set(G.phase!=="menu"&&!G.over,RK);if(ROOM){const sd=G.phase==="battle"&&!G.over?(G.cur===0?M:1-M):M;if(sd!==lastT){lastT=sd;post({gameon:"turn",seat:sd})}}
 if(G.phase==="menu"){h=`<h1>⚓ AMİRAL BATTI</h1><p class="sub">Klasik 10×10 deniz savaşı</p>
 <div class="card"><h2>Oyun modu</h2><div class="seg"><button class="${o.mode==="bot"?"":"sec"}" data-a="mode" data-v="bot">🤖 Bilgisayara karşı</button></div>
 <label>Oyuncu 1<input type="text" id="n1" value="${o.n1}" maxlength="14"></label>
 ${o.mode==="friend"?`<label>Oyuncu 2<input type="text" id="n2" value="${o.n2}" maxlength="14"></label>`:`<label>Zorluk<select id="diff"><option value="easy" ${o.diff==="easy"?"selected":""}>Kolay (rastgele atış)</option><option value="normal" ${o.diff==="normal"?"selected":""}>Normal (vurunca avlar)</option><option value="hard" ${o.diff==="hard"?"selected":""}>Zor (olasılık hesaplar)</option></select></label>`}
 <h2>Kurallar</h2><label><input type="checkbox" id="touch" ${o.touch?"checked":""}> Gemiler birbirine temas edebilir</label>
 <label><input type="checkbox" id="extra" ${o.extra?"checked":""}> İsabet edince tekrar atış hakkı</label>
 <p class="sub">Filo: Uçak Gemisi 5, Zırhlı 4, Kruvazör 3, Denizaltı 3, Muhrip 2. Bir gemi tüm karelerine isabet alınca batar ve adı duyurulur. Tüm filosu batan kaybeder.</p>
 <button style="width:100%" data-a="start">Oyuna başla</button></div>`}
 else if(G.phase==="place"){const P=G.p[G.pl];const left=P.ships.filter(s=>!s).length;
 h=`<h2>⚓ ${P.name}: filonu yerleştir</h2><p class="sub">Bir gemi seç, tahtaya dokun. Yerleşmiş gemiye dokunursan geri alınır. Döndürmek için butonu veya R tuşunu kullan.</p>
 <div class="tray">${SH.map((s,i)=>`<button class="${G.sel===i?"on":""} ${P.ships[i]?"done":""}" style="--l:${s[1]}" data-a="sel" data-v="${i}">${shipSVG(i,s[1],false)}<span>${P.ships[i]?"✓ ":""}${s[0]}</span></button>`).join("")}</div>
 <div><button class="sec" data-a="rot">↻ Yön: ${G.v?"Dikey":"Yatay"}</button><button class="sec" data-a="rand">🎲 Rastgele</button><button class="sec" data-a="clear">Temizle</button></div>
 <div class="boards">${boardHTML(P,"own",true)}</div>
 <button data-a="ready" ${left?"disabled":""}>Hazırım ✔</button>`}
 else if(G.phase==="wait"){h=`<h2>⏳ Rakip filosunu yerleştiriyor…</h2><p class="sub">Savaş, ikiniz de hazır olunca başlar.</p>`}
 else{const V=G.o.mode==="bot"||ROOM?0:G.cur,me=G.p[V],en=G.p[1-V];const inter=!G.lock&&!G.wait&&!G.over&&G.cur===V;
 h=`<h2>${G.over?"Oyun bitti":G.lock?"⏳ Rakip nişan alıyor…":`🎯 Sıra: ${G.p[G.cur].name}`}</h2>
 <div class="msg">${G.msg||"Düşman sularına ateş et!"}</div>
 ${G.wait&&!G.over?`<button data-a="pass">Sırayı ${G.p[1-G.cur].name}’e ver →</button>`:""}
 <div class="boards"><div><h2>${ROOM?pav(1)+esc(en.name)+" suları":"Düşman suları"}</h2>${boardHTML(en,G.over?"all":"enemy",inter)}${fleetHTML(en)}</div>
 <div><h2>${ROOM?pav(0)+esc(me.name):"Filon"}</h2>${boardHTML(me,"own",false)}${fleetHTML(me)}</div></div>
 <div class="log">${(G.log||[]).slice(-3).reverse().join("<br>")}</div>${ROOM?"":`<button class="sec" data-a="menu">Menü</button>`}`}
 if(G.pass)h+=`<div class="ov"><h1>${G.pass.t}</h1><p class="sub">${G.pass.s}</p><button data-a="ok">${G.pass.b}</button></div>`;
 if(G.over)h+=`<div class="ov win" id="win"><h1>🏆 ${G.p[G.cur].name} kazandı!</h1><p class="sub">Düşman filosu battı.</p>${ROOM?`<button data-a="ng-room">🏠 Oda Kur</button><button data-a="ng-bot">🤖 Botlarla Oyna</button>`:`<button data-a="menu">Yeni oyun</button><button data-a="ng-room">🏠 Oda Kur</button>`}<button class="sec" data-a="hide">Tahtaları gör</button></div>`;
 $("#app").innerHTML=h}

/* ---- Olaylar ---- */
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]"),c=e.target.closest(".c");
 if(b){const a=b.dataset.a,v=b.dataset.v;
  if(a==="mode"){G.o.n1=$("#n1").value;G.o.touch=$("#touch").checked;G.o.extra=$("#extra").checked;G.o.mode=v;return render()}
  if(a==="start"){const o=G.o;o.n1=$("#n1").value.trim()||"Oyuncu 1";o.touch=$("#touch").checked;o.extra=$("#extra").checked;
   if(o.mode==="friend")o.n2=($("#n2").value.trim()||"Oyuncu 2");else o.diff=$("#diff").value;
   G.p=[newP(o.n1,false),newP(o.mode==="bot"?"Amiral Bot":o.n2,o.mode==="bot")];G.phase="place";G.pl=0;G.sel=0;G.v=false;G.over=false;G.lock=false;G.wait=false;G.msg="";G.log=[];G.pass=o.mode==="friend"?{t:o.n1,s:"Rakip bakmasın! Filonu yerleştirme sırası sende.",b:"Hazırım"}:null;return render()}
  if(a==="sel"){G.sel=+v;return render()}
  if(a==="rot"){G.v=!G.v;return render()}
  if(a==="rand"){randomPlace(G.p[G.pl]);G.sel=null;return render()}
  if(a==="clear"){G.p[G.pl].ships=Array(5).fill(null);G.sel=0;return render()}
  if(a==="ng-room"||a==="ng-bot")return post({gameon:"newgame",choice:a.slice(3)});
  if(a==="ready"&&ROOM){G.rdyMe=true;emit({free:1,t:"rd"});if(G.rdyOpp)return startBattle();G.phase="wait";return render()}
  if(a==="ready"){if(G.o.mode==="bot"){randomPlace(G.p[1]);return startBattle()}
   if(G.pl===0){G.pl=1;G.sel=0;G.pass={t:G.p[0].name+" tamam",s:`Cihazı ${G.p[1].name}’e ver. Ekranı görmemeli!`,b:G.p[1].name+" hazır"};return render()}
   return startBattle()}
  if(a==="pass"){G.cur=1-G.cur;G.wait=false;G.pass={t:G.p[G.cur].name,s:"Cihaz sende. Rakip bakmasın!",b:"Ateşe hazırım"};return render()}
  if(a==="ok"){G.pass=null;return render()}
  if(a==="hide"){$("#win").style.display="none";return}
  if(a==="menu"){G.phase="menu";G.over=false;G.pass=null;return render()}
 }
 if(c){const x=+c.dataset.x,y=+c.dataset.y;
  if(G.phase==="place"){const P=G.p[G.pl],q=occ(P)[y][x];
   if(q!==-1){P.ships[q]=null;G.sel=q;return render()}
   if(G.sel!=null&&!P.ships[G.sel]&&canPlace(P,G.sel,x,y,G.v)){place(P,G.sel,x,y,G.v);const n=P.ships.findIndex(s=>!s);G.sel=n<0?null:n;render()}}
  else if(G.phase==="battle"&&!G.lock&&!G.wait&&!G.over&&!G.pass)humanShot(x,y)}
});
document.addEventListener("mouseover",e=>{const c=e.target.closest(".c");if(!c||G.phase!=="place")return;
 document.querySelectorAll(".pv,.bad").forEach(n=>n.classList.remove("pv","bad"));if(G.sel==null)return;
 const P=G.p[G.pl];if(P.ships[G.sel])return;const x=+c.dataset.x,y=+c.dataset.y,ok=canPlace(P,G.sel,x,y,G.v),len=SH[G.sel][1];
 for(let k=0;k<len;k++){const el=document.querySelector(`.c[data-x="${x+(G.v?0:k)}"][data-y="${y+(G.v?k:0)}"]`);el&&el.classList.add(ok?"pv":"bad")}});
document.addEventListener("keydown",e=>{if((e.key==="r"||e.key==="R")&&G.phase==="place"&&!/INPUT/.test(e.target.tagName)){G.v=!G.v;render()}});

/* ---- Savaş mantığı ---- */
function startBattle(){G.phase="battle";G.cur=ROOM&&M===1?1:0;G.lock=ROOM&&M===1;G.wait=false;G.msg="";G.log=[];G.pass=G.o.mode==="friend"?{t:G.p[0].name,s:"Savaş başlıyor! İlk atış sende.",b:"Ateşe hazırım"}:null;render()}
function shot(d,x,y){const att=G.p[G.cur],co=L[x]+(y+1);d.grid[y][x]=1;let hit=false,sunk=null;
 const i=occ(d)[y][x];
 if(i>=0){hit=true;d.grid[y][x]=2;const s=d.ships[i];s.hits++;if(s.hits>=s.len)sunk=SH[i][0]}
 G.msg=`${att.name} → ${co}: `+(sunk?`💥 ${sunk} battı!`:hit?"🔥 İSABET!":"💦 Iska.");G.log.push(G.msg);
 if(d.ships.every(s=>s.hits>=s.len)){G.over=true;G.lock=false;G.wait=false}
 return{hit,sunk}}
function humanShot(x,y){const d=G.p[1-G.cur];if(d.grid[y][x])return;
 if(ROOM){emit({t:"s",x,y,next:1-M});G.lock=true;G.msg="Atış: "+L[x]+(y+1)+"…";return render()}
 const r=shot(d,x,y);
 if(G.over)return render();
 if(r.hit&&G.o.extra){G.msg+=" Tekrar at!";return render()}
 if(G.o.mode==="bot"){G.cur=1;G.lock=true;render();setTimeout(botTurn,1100)}else{G.wait=true;render()}}
function botTurn(){const d=G.p[0],[x,y]=botPick(d),r=shot(d,x,y);
 if(G.over)return render();
 if(r.hit&&G.o.extra){render();return setTimeout(botTurn,1000)}
 G.cur=0;G.lock=false;render()}
function botPick(d){const g=d.grid,free=[],sunk=new Set(),hits=[];
 d.ships.forEach(s=>{if(s.hits>=s.len)cellsOf(s).forEach(([a,b])=>sunk.add(a+","+b))});
 for(let y=0;y<10;y++)for(let x=0;x<10;x++){if(!g[y][x])free.push([x,y]);else if(g[y][x]===2&&!sunk.has(x+","+y))hits.push([x,y])}
 if(G.o.diff==="easy"||(G.o.diff==="normal"&&!hits.length))return rnd(free);
 const sc=Array.from({length:10},()=>Array(10).fill(0));
 d.ships.filter(s=>s.hits<s.len).forEach(s=>{for(let v=0;v<2;v++)for(let y=0;y<10;y++)for(let x=0;x<10;x++){
  const cs=cellsOf({x,y,v,len:s.len});if(cs.some(([a,b])=>a>9||b>9||g[b][a]===1||sunk.has(a+","+b)))continue;
  const h=cs.filter(([a,b])=>g[b][a]===2).length;if(hits.length&&!h)continue;const w=h?1+h*25:1;
  cs.forEach(([a,b])=>{if(!g[b][a])sc[b][a]+=w})}});
 let best=-1,pool=[];free.forEach(([x,y])=>{const v=sc[y][x];if(v>best){best=v;pool=[[x,y]]}else if(v===best)pool.push([x,y])});
 return pool.length?rnd(pool):rnd(free)}
/* ---- oda modu ---- */
function onResult(ev){const d=G.p[1],co=L[ev.x]+(ev.y+1);d.grid[ev.y][ev.x]=ev.hit?2:1;if(ev.sunk)d.ships[ev.i]={x:ev.sx,y:ev.sy,v:ev.v,len:ev.len,hits:ev.len};
 G.msg=`${G.p[0].name} → ${co}: `+(ev.sunk?`💥 ${ev.sunk} battı!`:ev.hit?"🔥 İSABET!":"💦 Iska.");G.log.push(G.msg);
 if(ev.over){G.over=true;G.lock=false;G.cur=0;RK=[M,1-M]}else{G.cur=1;G.lock=true}render()}
function onShot(ev){const me=G.p[0];if(me.grid[ev.y][ev.x])return;G.cur=1;const i=occ(me)[ev.y][ev.x],r=shot(me,ev.x,ev.y),s=i>=0?me.ships[i]:null;
 emit({free:1,t:"r",x:ev.x,y:ev.y,hit:r.hit,sunk:r.sunk,i,sx:s&&s.x,sy:s&&s.y,v:s&&s.v,len:s&&s.len,over:G.over});
 if(G.over)RK=[1-M,M];else{G.cur=0;G.lock=false}render()}
function handle(ev){if(ev.t==="rd"){G.rdyOpp=true;if(G.rdyMe&&G.phase==="wait")startBattle()}else if(ev.t==="s")onShot(ev);else if(ev.t==="r")onResult(ev)}
addEventListener("message",e=>{const d=e.data||{};if(e.source!==parent)return;
 if(d.gameon==="init"){M=d.me|0;const nm=p=>p.username?"@"+p.username:(p.first_name||"Oyuncu"),pl=d.players||[];
  PA=[(pl[M]||{}).avatar||"profil1",(pl[1-M]||{}).avatar||"profil1"];G.o.mode="room";G.o.touch=false;G.o.extra=false;
  G.p=[newP(nm(pl[M]||{}),false),newP(nm(pl[1-M]||{}),false)];G.phase="place";G.pl=0;G.sel=0;G.v=false;G.over=false;G.lock=false;G.wait=false;G.msg="";G.log=[];G.pass=null;G.rdyMe=G.rdyOpp=false;
  started=true;render();rq.splice(0).forEach(handle)}
 else if(d.gameon==="remote"&&d.data){started?handle(d.data):rq.push(d.data)}});
