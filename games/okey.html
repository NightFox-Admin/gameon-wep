function insert(t,best,from){hand[from]=null;if(hand[best]){const r=best<COLS?0:1,b0=r*COLS;let e=-1,bd=99;for(let i=b0;i<b0+COLS;i++)if(!hand[i]&&Math.abs(i-best)<bd){bd=Math.abs(i-best);e=i}

const rep=t=>t.j?{c:okey.c,n:okey.n}:t;
const vpair=g=>{if(g.length!==2)return false;const f=g.filter(t=>!isOkey(t)).map(rep);return f.length<2||(f[0].c===f[1].c&&f[0].n===f[1].n)};
function resolve(g){const L=g.length,ns=g.filter(t=>!isOkey(t)),ws=g.filter(isOkey);
 if(L===2&&vpair(g)){const r=ns.length?rep(ns[0]):{c:okey.c,n:okey.n};return{kind:'pair',items:g.map(t=>({t,c:r.c,n:r.n,w:isOkey(t)?1:0}))}}
 if(!valid(g))return null;const f=ns.map(rep),items=[];
 if(L<=4&&(f.length<2||f.every(x=>x.n===f[0].n))){const n=f.length?f[0].n:13,used=new Set(f.map(x=>x.c));g.forEach(t=>{if(isOkey(t)){const c=[0,1,2,3].find(c=>!used.has(c));used.add(c);items.push({t,c,n,w:1})}else items.push({t,c:rep(t).c,n,w:0})});return{kind:'set',items}}
 const s=f.length?Math.min(Math.min(...f.map(x=>x.n)),14-L):1,c=f.length?f[0].c:0;
 for(let i=0;i<L;i++){const n=s+i,t=ns.find(x=>rep(x).n===n);items.push(t?{t,c,n,w:0}:{t:ws.pop(),c,n,w:1})}return{kind:'run',items}}
function fits(m,t){if(m.kind==='pair')return null;const w=isOkey(t),r=rep(t),it=m.items;
 if(m.kind==='set'){const n=it[0].n;if(it.length>=4)return null;const u=new Set(it.map(x=>x.c));if(w)return{c:[0,1,2,3].find(c=>!u.has(c)),n,w:1,end:1};return r.n===n&&!u.has(r.c)?{c:r.c,n,end:1}:null}
 const c=it[0].c,lo=it[0].n,hi=it.at(-1).n;if(w){if(hi<13)return{c,n:hi+1,w:1,end:1};if(lo>1)return{c,n:lo-1,w:1};return null}
 if(r.c!==c)return null;if(r.n===hi+1)return{c,n:r.n,end:1};if(r.n===lo-1)return{c,n:r.n};return null}
function renderMelds(){const el=$('#melds'),tot=melds.reduce((a,m)=>a+m.items.length*23+20,0);let s=1;while(s>.5&&Math.ceil(tot*1.15/(590/s))*38*s>134)s-=.05;el.style.width=590/s+'px';el.style.transform='scale('+s+')';el.innerHTML=melds.map((m,i)=>`<div class='meld o${m.owner}' data-i=${i}>${m.items.map(x=>`<span class='mt k${x.c}${x.w?' w':''}'>${x.n}</span>`).join('')}</div>`).join('')}
function layoff(t,i){if(!mode[0]||phase!=='discard')return false;const m=melds[i],f=fits(m,t);if(!f||hand.filter(Boolean).length<2){say(f?'Elinde en az bir taş kalmalı':'Bu taş oraya işlenmez');return false}

function openMe(){if(turn||phase!=='discard'||busy||over)return;const sr=groups().map(resolve).filter(Boolean),rs=sr.filter(r=>r.kind!=='pair'),ps=sr.filter(r=>r.kind==='pair'),sum=rs.reduce((s,r)=>s+r.items.reduce((a,x)=>a+x.n,0),0);let use;
 if(mode[0]==='run')use=rs;else if(mode[0]==='pair')use=ps;else if(sum>=101)use=rs;else if(ps.length>=5)use=ps;else return say(rs.length?`Açmak için perlerin toplamı en az 101 olmalı (şimdi ${sum})`:ps.length?'Çift açmak için en az 5 çift gerekir':'Önce geçerli perleri aralarında boşluk bırakmadan diz');
 if(!use.length)return say('Yeni geçerli per yok');if(hand.filter(Boolean).length-use.reduce((a,r)=>a+r.items.length,0)<1)return say('Elinde atılacak en az bir taş kalmalı');
 if(!mode[0])mode[0]=use===ps?'pair':'run';
 use.forEach(r=>{r.owner=0;melds.push(r);r.items.forEach(x=>{hand[x.t.slot]=null;x.t.slot=-1;x.t.el.remove();x.t.el=null})});renderMelds();emit({t:'o',mode:mode[0],melds:use.map(r=>({kind:r.kind,items:r.items.map(x=>[x.t.id,x.c,x.n,x.w||0])}))});clack(.8);ui()}
// ---- bot logic
function cands(h){const wl=h.filter(isOkey),nat=h.filter(t=>!isOkey(t)),out=[],all4=[0,1,2,3];
 for(let c=0;c<4;c++)for(let s=1;s<=11;s++){const it=[];let u=0;for(let n=s;n<=13;n++){const t=nat.find(x=>rep(x).c===c&&rep(x).n===n);if(t)it.push({t,c,n,w:0});else if(u<wl.length)it.push({t:wl[u++],c,n,w:1});else break;if(it.length>=3&&!it[0].w&&!it.at(-1).w)out.push({kind:'run',items:it.slice()})}}
 for(let n=1;n<=13;n++){const av=all4.filter(c=>nat.some(x=>rep(x).c===c&&rep(x).n===n));for(let m=0;m<16;m++){const cs=av.filter(c=>m>>c&1);if(cs.length<2||cs.length!==all4.filter(c=>m>>c&1).length)continue;
  for(let w=0;w<=wl.length;w++){const k=cs.length+w;if(k<3||k>4)continue;const it=cs.map(c=>({t:nat.find(x=>rep(x).c===c&&rep(x).n===n),c,n,w:0})),free=all4.filter(c=>!cs.includes(c));for(let i=0;i<w;i++)it.push({t:wl[i],c:free[i],n,w:1});out.push({kind:'set',items:it})}}}
 out.forEach(c=>c.sum=c.items.reduce((a,x)=>a+x.n,0));return out}
function plan(h){const used=new Set(),ch=[];cands(h).sort((a,b)=>b.sum-a.sum).forEach(c=>{if(c.items.some(i=>used.has(i.t.id))||used.size+c.items.length>=h.length)return;c.items.forEach(i=>used.add(i.t.id));ch.push(c)});return ch}
function pairsPlan(h){const g={},out=[];h.filter(t=>!isOkey(t)).forEach(t=>{const r=rep(t),k=r.c+'-'+r.n;(g[k]=g[k]||[]).push(t)});Object.values(g).forEach(a=>{if(a.length>=2){const r=rep(a[0]);out.push({kind:'pair',sum:r.n,items:a.slice(0,2).map(t=>({t,c:r.c,n:r.n,w:0}))})}});return out}
function wantPile(p,top){if(mode[p]==='pair')return false;const pl=plan(hands[p].concat(top));return pl.some(c=>c.items.some(i=>i.t===top))&&(mode[p]||pl.reduce((s,c)=>s+c.sum,0)>=101)}
function botPlay(p){const h=hands[p];let pl;
 if(mode[p]==='pair')pl=pairsPlan(h);else{pl=plan(h);if(!mode[p]){if(pl.reduce((s,c)=>s+c.sum,0)>=101)mode[p]='run';else{const pr=pairsPlan(h);if(pr.length>=5){mode[p]='pair';pl=pr}else return false}}}
 let laid=false;pl.forEach(c=>{if(h.length-c.items.length<1)return;c.items.forEach(x=>h.splice(h.indexOf(x.t),1));c.owner=p;melds.push(c);laid=true});

 renderMelds();if(laid)clack(.7);return laid}
function pickDisc(p){const h=hands[p],c=h.filter(t=>!isOkey(t)),pool=c.length?c:h,safe=pool.filter(t=>!melds.some(m=>fits(m,t))),a=safe.length?safe:pool;return a.reduce((x,y)=>score(h,y)<score(h,x)?y:x)}
// ---- scoring
function hv(p){return(p?hands[p]:hand.filter(Boolean)).reduce((s,t)=>s+(isOkey(t)?101:t.j?okey.n:t.n),0)}
function endHand(w,last,spec){const jk=isOkey(last)?2:1,f=jk*(mode[w]==='pair'?2:1),d=[];
 for(let p=0;p<4;p++){let x;if(p===w)x=spec?-202*jk:-101*f;else if(spec)x=404*jk;else{const m=mode[p],v=hv(p);x=m==='run'?v*f:m==='pair'?v*2*f:Math.min(202*f,404)}x+=pen[p];d.push(x);scores[p]+=x}
 round++;const rk=[0,1,2,3].sort((a,b)=>a===w?-1:b===w?1:d[a]-d[b]).map(q=>(M+q)%4);finish(w?NAMES[w]+' eli bitirdi':'Tebrikler, eli bitirdin!',NAMES.map((n,p)=>`${n}: ${d[p]>0?'+':''}${d[p]}${pen[p]?' (ceza '+pen[p]+')':''}`).join('\n')+(jk>1?'\nOkey ile bitirildi: puanlar katlandı.':''),rk)}
