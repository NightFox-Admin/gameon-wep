<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050a18">
<title>Bakımdayız</title>
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--bg:#050a18;--blue:#3b82f6;--violet:#8b5cf6;--gold:#fbbf24;--ink:#eaf1ff;--mut:#8ea8d8;--px:0;--py:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{min-height:100dvh;display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}

/* ---------- arka plan ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;opacity:.55;will-change:transform;
  background:radial-gradient(circle,var(--c) 0,rgba(0,0,0,0) 66%);animation:drift var(--t) ease-in-out infinite alternate;
  translate:calc(var(--px)*var(--k)*1px) calc(var(--py)*var(--k)*1px)}
.blob:nth-child(1){--c:#2563eb;--t:16s;--k:-28;width:78vmax;height:78vmax;left:-28vmax;top:-30vmax}
.blob:nth-child(2){--c:#7c3aed;--t:21s;--k:22;width:66vmax;height:66vmax;right:-24vmax;top:10vh;animation-delay:-6s}
.blob:nth-child(3){--c:#0ea5e9;--t:18s;--k:-16;width:58vmax;height:58vmax;left:6vw;bottom:-30vmax;animation-delay:-10s}
.blob:nth-child(4){--c:#d4a017;--t:24s;--k:30;width:34vmax;height:34vmax;right:8vw;bottom:-12vmax;opacity:.3;animation-delay:-14s}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(8vmax,5vmax,0) scale(1.12)}100%{transform:translate3d(-6vmax,9vmax,0) scale(.94)}}
.grid{position:absolute;inset:-50%;background-image:linear-gradient(#ffffff12 1px,transparent 1px),linear-gradient(90deg,#ffffff12 1px,transparent 1px);
  background-size:56px 56px;transform:perspective(700px) rotateX(62deg) translateY(0);animation:gridmove 7s linear infinite;
  -webkit-mask-image:radial-gradient(ellipse at 50% 55%,#000 0,transparent 62%);mask-image:radial-gradient(ellipse at 50% 55%,#000 0,transparent 62%);opacity:.5}
@keyframes gridmove{to{background-position:0 56px}}
canvas{position:absolute;inset:0;width:100%;height:100%}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 35%,#000b 100%)}

/* ---------- kart ---------- */
.card{position:relative;z-index:2;width:min(92vw,620px);padding:clamp(26px,5vw,48px) clamp(20px,5vw,44px) clamp(24px,4vw,36px);text-align:center;border-radius:28px;
  background:linear-gradient(160deg,#0f1b3acc,#0a1128cc);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 30px 80px #000a,inset 0 1px 0 #ffffff22;animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
  transform:perspective(900px) rotateX(calc(var(--py)*-1.2deg)) rotateY(calc(var(--px)*1.4deg));transition:transform .15s ease-out}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--ang),#3b82f6,#8b5cf6,#fbbf24,#3b82f6);animation:spin 6s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@keyframes spin{to{--ang:360deg}}
@keyframes rise{from{opacity:0;translate:0 40px;scale:.96}}

/* ---------- dişliler ---------- */
.gears{position:relative;width:min(58vw,230px);margin:0 auto 6px;aspect-ratio:230/150}
.gears svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 8px 22px #3b82f688)}
.g{transform-box:fill-box;transform-origin:center}
#g1{animation:cw 9s linear infinite}#g2{animation:ccw 6.2s linear infinite}#g3{animation:cw 4.6s linear infinite}
@keyframes cw{to{transform:rotate(360deg)}}@keyframes ccw{to{transform:rotate(-360deg)}}
.pulse{position:absolute;left:50%;top:50%;width:70%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:2px solid #60a5fa66;animation:ping 2.8s ease-out infinite;pointer-events:none}
.pulse:nth-child(2){animation-delay:1.4s}
@keyframes ping{from{scale:.5;opacity:.9}to{scale:1.5;opacity:0}}

/* ---------- yazılar ---------- */
h1{font-size:clamp(40px,10.5vw,76px);line-height:1.05;font-weight:900;letter-spacing:-1.5px;margin:6px 0 4px;
  background:linear-gradient(100deg,#60a5fa 0%,#c4b5fd 35%,#fde68a 55%,#60a5fa 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 5s linear infinite;
  filter:drop-shadow(0 4px 24px #3b82f655)}
h1 span{display:inline-block;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*70ms + .3s)}
@keyframes shine{to{background-position:-250% 0}}
@keyframes pop{from{opacity:0;transform:translateY(34px) rotate(-8deg) scale(.6)}}
p.sub{max-width:44ch;margin:10px auto 0;font-size:clamp(14px,3.6vw,17px);line-height:1.6;color:var(--mut);animation:fade 1s .9s both}
@keyframes fade{from{opacity:0;translate:0 12px}}
.status{height:26px;margin:20px 0 14px;position:relative;font-weight:700;font-size:clamp(13px,3.4vw,15px);color:#cfe0ff}
.status b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;opacity:0;transform:translateY(10px);transition:.5s}
.status b.on{opacity:1;transform:none}

/* ---------- ilerleme ---------- */
.bar{height:10px;border-radius:99px;background:#ffffff14;overflow:hidden;position:relative;box-shadow:inset 0 1px 3px #0008}
.bar i{position:absolute;inset:0;width:45%;border-radius:inherit;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#fbbf24);animation:slide 2.2s ease-in-out infinite}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff9 50%,transparent 70%);animation:glint 1.6s linear infinite}
@keyframes slide{0%{left:-45%}100%{left:100%}}@keyframes glint{from{translate:-100% 0}to{translate:100% 0}}

/* ---------- geri sayım ---------- */
.eta{display:none;margin-top:18px}
.eta.on{display:block}
.eta small{display:block;color:var(--mut);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.time{display:flex;justify-content:center;gap:10px}
.time div{min-width:64px;padding:10px 6px;border-radius:14px;background:#ffffff0d;border:1px solid #ffffff1c}
.time b{display:block;font-size:clamp(22px,6vw,30px);font-variant-numeric:tabular-nums;color:var(--gold)}
.time span{font-size:11px;color:var(--mut)}

/* ---------- düğme ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:24px;padding:13px 26px;border-radius:99px;text-decoration:none;font-weight:800;font-size:15px;color:#fff;
  background:linear-gradient(100deg,#2563eb,#7c3aed);box-shadow:0 8px 24px #3b82f666;transition:transform .2s,box-shadow .2s;animation:fade 1s 1.2s both}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 14px 34px #7c3aed88}
.btn:active{transform:scale(.97)}
.foot{margin-top:16px;font-size:12px;color:#6f89b8;animation:fade 1s 1.4s both}

@media (max-width:420px){.time{gap:6px}.time div{min-width:56px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}.grid{display:none}}
</style>
</head>
<body>
<div class="bg"><i class="blob"></i><i class="blob"></i><i class="blob"></i><i class="blob"></i><div class="grid"></div><canvas id="p"></canvas><div class="vig"></div></div>

<main class="card" id="card">
  <div class="gears" aria-hidden="true">
    <i class="pulse"></i><i class="pulse"></i>
    <svg viewBox="0 0 230 150">
      <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
      <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d4a017"/></linearGradient></defs>
      <g id="g1" class="g"></g><g id="g2" class="g"></g><g id="g3" class="g"></g>
    </svg>
  </div>

  <h1 id="title" aria-label="Bakımdayız">Bakımdayız</h1>
  <p class="sub">Daha hızlı, daha güvenli ve daha eğlenceli bir deneyim için sistemlerimizi güncelliyoruz. Çok yakında geri döneceğiz.</p>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="bar" aria-hidden="true"><i></i></div>

  <div class="eta" id="eta">
    <small>Tahmini dönüş</small>
    <div class="time"><div><b id="h">00</b><span>saat</span></div><div><b id="m">00</b><span>dakika</span></div><div><b id="s">00</b><span>saniye</span></div></div>
  </div>

  <a class="btn" id="tg" href="#" target="_blank" rel="noopener">✈️ Duyurular için botu takip et</a>
  <div class="foot">Anlayışın için teşekkürler 💙</div>
</main>

<script src="config.js"></script>
<script>
/* ===== AYARLAR (burayı kendine göre düzenle) ===== */
const CONFIG = {
  END_TIME: null,                     // örn. "2026-11-25T18:00:00+03:00"  (null = geri sayım gösterilmez)
  TELEGRAM: "https://t.me/GameonTR_bot",   // bot bağlantın (boş bırakırsan düğme gizlenir)
  CHECK_URL: "",                      // örn. "https://sunucum.com/health" → yanıt gelince sayfa kendiliğinden yenilenir
  MESSAGES: ["🔧 Sunucular güncelleniyor", "🎮 Oyunlar test ediliyor", "✨ Yeni özellikler hazırlanıyor", "🛡️ Güvenlik kontrolleri yapılıyor"]
};

/* ===== harf harf başlık ===== */
const t = document.getElementById('title');
t.innerHTML = [...t.textContent].map((c, i) => `<span style="--i:${i}" aria-hidden="true">${c}</span>`).join('');

/* ===== dişliler (SVG, kodla çizilir) ===== */
function gear(id, cx, cy, r, teeth, fill, hole) {
  const inner = r * .78, step = Math.PI * 2 / teeth; let d = '';
  for (let i = 0; i < teeth; i++) {
    const a = i * step, p = (ang, rad) => [(cx + Math.cos(ang) * rad).toFixed(1), (cy + Math.sin(ang) * rad).toFixed(1)];
    const pts = [p(a - step * .30, inner), p(a - step * .17, r), p(a + step * .17, r), p(a + step * .30, inner)];
    d += (i ? 'L' : 'M') + pts.map(q => q.join(',')).join('L');
  }
  document.getElementById(id).innerHTML =
    `<path d="${d}Z" fill="${fill}" stroke="#ffffff55" stroke-width="1.5" stroke-linejoin="round"/>
     <circle cx="${cx}" cy="${cy}" r="${inner * .62}" fill="none" stroke="#ffffff33" stroke-width="2"/>
     <circle cx="${cx}" cy="${cy}" r="${hole}" fill="#0a1128" stroke="#ffffff66" stroke-width="2"/>`;
}
gear('g1', 92, 82, 52, 12, 'url(#gr)', 14);
gear('g2', 164, 60, 36, 9, 'url(#gd)', 10);
gear('g3', 160, 118, 22, 7, 'url(#gr)', 6);

/* ===== durum mesajları ===== */
const st = document.getElementById('status');
st.innerHTML = CONFIG.MESSAGES.map(m => `<b>${m}</b>`).join('');
let k = 0; const items = st.children;
(function tick() { [...items].forEach((e, i) => e.classList.toggle('on', i === k)); k = (k + 1) % items.length; setTimeout(tick, 2600); })();

/* ===== geri sayım ===== */
if (CONFIG.END_TIME) {
  const end = new Date(CONFIG.END_TIME).getTime(), eta = document.getElementById('eta'), z = n => String(n).padStart(2, '0');
  (function cd() {
    const left = Math.max(0, end - Date.now());
    if (!isNaN(end)) eta.classList.add('on');
    h.textContent = z(Math.floor(left / 36e5)); m.textContent = z(Math.floor(left % 36e5 / 6e4)); s.textContent = z(Math.floor(left % 6e4 / 1e3));
    if (left > 0) setTimeout(cd, 500);
  })();
}

/* ===== telegram düğmesi ===== */
const tg = document.getElementById('tg');
CONFIG.TELEGRAM ? tg.href = CONFIG.TELEGRAM : tg.style.display = 'none';

/* ===== bakım bitince kendiliğinden yenile (sunucu /api/status) ===== */
const API=((window.GAMEON_CONFIG||{}).API_URL||'').replace(/\/+$/,'');
if (API) setInterval(() => fetch(API + '/api/status', { cache: 'no-store' }).then(r => r.json()).then(j => { if (j && j.maintenance === false) (parent !== window ? parent : window).location.reload(); }).catch(() => {}), 15000);
tg.addEventListener('click', e => { const T = (window.parent && window.parent.Telegram) || window.Telegram; if (T && T.WebApp && T.WebApp.openTelegramLink && CONFIG.TELEGRAM) { e.preventDefault(); T.WebApp.openTelegramLink(CONFIG.TELEGRAM); } });

/* ===== fare / dokunma ile hafif derinlik ===== */
const root = document.documentElement.style;
addEventListener('pointermove', e => { root.setProperty('--px', (e.clientX / innerWidth - .5) * 2); root.setProperty('--py', (e.clientY / innerHeight - .5) * 2); }, { passive: true });
addEventListener('pointerleave', () => { root.setProperty('--px', 0); root.setProperty('--py', 0); });

/* ===== parçacıklar ===== */
const cv = document.getElementById('p'), cx = cv.getContext('2d');
let W, H, dots = [], dpr = Math.min(devicePixelRatio || 1, 2);
function size() { W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; dots = Array.from({ length: Math.round(Math.min(70, innerWidth / 14)) }, () => ({
  x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.8 + .6) * dpr, v: (Math.random() * .35 + .12) * dpr, o: Math.random() * .6 + .2, g: Math.random() < .2 })); }
size(); addEventListener('resize', size);
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) (function loop() {
  if (!document.hidden) {
    cx.clearRect(0, 0, W, H);
    for (const d of dots) {
      d.y -= d.v; d.x += Math.sin(d.y / 90 + d.o * 6) * .25 * dpr; if (d.y < -10) { d.y = H + 10; d.x = Math.random() * W; }
      cx.beginPath(); cx.arc(d.x, d.y, d.r, 0, 6.283); cx.fillStyle = d.g ? `rgba(251,191,36,${d.o})` : `rgba(147,197,253,${d.o})`; cx.shadowBlur = 10 * dpr; cx.shadowColor = d.g ? '#fbbf24' : '#60a5fa'; cx.fill();
    }
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
